name: Validate game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser tests outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/ae-browser-tests" --no-save --package-lock=false playwright@1.62.1
          export NODE_PATH="$RUNNER_TEMP/ae-browser-tests/node_modules"
          echo "NODE_PATH=$NODE_PATH" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ae-browser-tests/node_modules/.bin/playwright" install-deps chromium webkit
          # Use the official Microsoft mirror and Google Chrome for Testing origin.
          # The default Chromium CDN currently serves a certificate for another host.
          PLAYWRIGHT_DOWNLOAD_HOST=https://playwright.download.prss.microsoft.com/dbazure/download/playwright "$RUNNER_TEMP/ae-browser-tests/node_modules/.bin/playwright" install webkit
          AE_CHROME_VERSION=$(node -e "const fs=require('node:fs'),path=require('node:path');const file=path.join(path.dirname(require.resolve('playwright-core/package.json')),'browsers.json');process.stdout.write(JSON.parse(fs.readFileSync(file,'utf8')).browsers.find(b=>b.name==='chromium').browserVersion)")
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 "https://storage.googleapis.com/chrome-for-testing-public/$AE_CHROME_VERSION/linux64/chrome-linux64.zip" --output "$RUNNER_TEMP/ae-browser-tests/chrome.zip"
          unzip -q "$RUNNER_TEMP/ae-browser-tests/chrome.zip" -d "$RUNNER_TEMP/ae-browser-tests"
      - name: Select installed Chromium
        run: |
          test -x "$RUNNER_TEMP/ae-browser-tests/chrome-linux64/chrome"
          echo "AE_CHROMIUM_PATH=$RUNNER_TEMP/ae-browser-tests/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Check game logic and workflows
        run: |
          node tests/economy-smoke.test.js
          node tests/runtime-performance.test.js
          node tests/trading-identity.test.js
          node tests/corporate-banking.test.js
          node tests/staff-system.test.js
          node tests/commerce-campaign.test.js
          AE_BROWSER=webkit node tests/commerce-campaign.test.js
          node tests/backup-restore.test.js
          AE_BROWSER=webkit node tests/backup-restore.test.js
          node tests/visual-smoke.test.js
          node tests/publication-smoke.test.js
          node tests/vehicle-collection.test.js
          AE_BROWSER=webkit node tests/vehicle-collection.test.js
          node tests/first-sale-guide.test.js
          AE_BROWSER=webkit node tests/first-sale-guide.test.js
          node tests/iphone-webkit.test.js
      - name: Keep browser screenshots and WebKit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-browser-review
          path: |
            /tmp/auto-empire-review
            /tmp/auto-empire-webkit
            /tmp/auto-empire-first-sale
            /tmp/auto-empire-vehicle-collection
          if-no-files-found: ignore
          retention-days: 7
