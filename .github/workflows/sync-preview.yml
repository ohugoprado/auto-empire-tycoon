name: Sync game preview
on:
  push:
    branches:
      - feature/consolidacao-alpha-06
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-empire-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Checkout game development
        uses: actions/checkout@v4
        with:
          ref: feature/consolidacao-alpha-06
          path: .game-preview-source
      - name: Prepare isolated preview
        shell: bash
        run: |
          mkdir -p preview
          cp .game-preview-source/index.html preview/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preview/index.html')
          s=p.read_text()
          s=s.replace("const KEY='autoempire_v02'", "const KEY='autoempire_preview_v06'")
          s=s.replace("const oldKey='autoempire_v1'", "const oldKey='autoempire_preview_legacy'")
          s=s.replace('href="./manifest.webmanifest"', 'href="../manifest.webmanifest"')
          s=s.replace('href="./icons/icon-192.png"', 'href="../icons/icon-192.png"')
          s=s.replace('navigator.serviceWorker.register("./sw.js")', 'Promise.resolve()')
          p.write_text(s)
          PY
          rm -rf .game-preview-source
      - name: Publish preview folder to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(preview): sync Alpha 0.6 test build"
            git push origin HEAD:main
          fi
